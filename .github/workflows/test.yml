name: Test plugin

on:
  push:
    branches: ["main", "plugin-management"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: python -m pip install packaging
      - name: Validate manifest
        shell: python
        run: |
          import json
          from pathlib import Path
          from packaging.specifiers import SpecifierSet
          from packaging.version import Version
          data = json.loads(Path("plugin.json").read_text(encoding="utf-8"))
          assert data["id"] == "ai_summary"
          assert data["api_version"] == 1
          assert data["requires"] == ["processing"]
          assert data["python_requires"] == []
          assert data["execution"] == "in_process"
          assert data["rpc_api_version"] is None
          assert SpecifierSet(data["app_requires"]).contains(Version("0.2.0.dev0"), prereleases=True)
      - name: Check Python syntax
        run: python -m compileall -q __init__.py plugin.py client.py errors.py routes.py services.py worker.py scripts/build_registry_artifact.py

      - name: Check OCR proxy runtime imports
        shell: python
        run: |
          from pathlib import Path
          source = Path("services.py").read_text(encoding="utf-8")
          assert "import base64" in source
          assert "base64.b64encode" in source
      - name: Check plugin boundaries
        shell: bash
        run: |
          if grep -REn 'from \.\.(\.|[A-Za-z_])' --include='*.py' . --exclude-dir=.git; then
            echo "External plugin must use fuckclassroom.* for host imports" >&2
            exit 1
          fi
          if grep -REn 'fuckclassroom\.plugins\.ai_summary\.' --include='*.py' . --exclude-dir=.git; then
            echo "AI Summary Worker must load local package modules" >&2
            exit 1
          fi
      - name: Smoke-build Registry v1 artifact
        run: |
          python scripts/build_registry_artifact.py 0.1.0-ci.0
          sha256sum -c ai_summary-0.1.0-ci.0.zip.sha256
